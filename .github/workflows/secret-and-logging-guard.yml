name: Secret and Logging Guard

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'custom/**'
      - 'clinic/**'
      - '.github/workflows/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for risky patterns
        run: |
          ! grep -R "smtp_auth_pass" modules custom clinic .github/workflows || exit 1
          ! grep -R "debug = 1" modules custom clinic .github/workflows || exit 1
